<!--business-card.html-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width , initial-scale=1.0">
        <title>Business Card</title>
    </head>
    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="https://www.github.com" target="_blank">My Github</a></li>
                    <li><a href="https://www.LinkedIn.com" target="_blank">My LinkedIn</a></li>
                    <li><a href="https://swww.x.com" target="_blank">My X Account</a></li>
                </ul>
            </nav>
        </header>

        
        <main>

            <section>

            <h1>Elvis Musungu Simiyu</h1>
            <h2>Aspiring Full-Stack Developer</h2>

            </section>

            <hr>

            <section>

                <h2>Contact Information</h2>

                <p>Email: <a href="mailto:elvis@example.com">elvis@example.com</a></p>

                <p>Tel:<a href="tel:0723856827"> 0712345678</a></p>

                <address>
                    City:Nairobi Kenya
                </address>

            </section>

            <section>
                <h2>Contact Me</h2>

                <form action="/submit" method="POST">
                    <div>
                        <label for="name">Name</label><br>
                        <input type="text" id="name" name="name" placeholder="Elvis">
                    </div>
                    <br>

                    <div>
                        <label for="email">Email</label><br>
                        <input type="email" id="email" name="email" placeholder="elvis@mail.com">    
                    </div>
                    <br>

                    <div>
                        <label for="message">Message</label><br>
                        <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here"></textarea>
                    </div>
                    <br>

                    <button type="submit">Send Your Message</button>

                </form>
            </section>

        </main>
        <footer>
            <p>&copy; 2026 Elvis Simiyu</p>
        </footer>
    </body>
</html>
